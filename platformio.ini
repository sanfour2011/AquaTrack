[common]
COM_PORT = COM4
MONITOR_BAUD_RATE = 9600

[env:esp32-c3-devkitm-1]
platform = espressif32
framework = arduino
board = esp32-c3-devkitm-1
upload_port = ${common.COM_PORT}
monitor_port = ${common.COM_PORT}
monitor_speed = ${common.MONITOR_BAUD_RATE}
board_build.extra_flags = # Nur für ESP32-C3 super mini
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
build_flags = 
    -DMONITOR_SPEED=${common.MONITOR_BAUD_RATE}    
lib_deps = 
    bogde/HX711@^0.7.5


[env:native_test_env]
platform = native
test_framework = googletest
build_flags = 
    -DNATIVE_TESTING
    -O0          ; Keine Optimierungen
    -g3          ; Maximale Debug-Informationen
    -fno-inline  ; Inline-Funktionen deaktivieren (wichtig für Breakpoints)
;lib_ignore = Sensors
build_src_filter = -<../lib/ScaleSensors/*>
test_filter = test_native/*
build_type = debug 


[env:hardware_test_env]
platform = espressif32
framework = arduino
test_framework = googletest
board =  esp32-c3-devkitm-1
;GoogleTest not building for ESP32 #1476
;https://github.com/platformio/platform-espressif32/issues/1476#issuecomment-2416462921
build_unflags = -std=gnu++11 ;otherwise googleTest: "#error C++ versions less than C++14 are not supported."
build_flags = -DREAL_HARDWARE -std=c++14
; test_filter = test_hardware/test_dummy
test_filter = test_hardware/test_HX711Sensor
; test_filter = test_hardware.*
upload_port = ${common.COM_PORT}
board_build.extra_flags = # Nur für ESP32-C3 super mini
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps = 
    bogde/HX711@^0.7.5



